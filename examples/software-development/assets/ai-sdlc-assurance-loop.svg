<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">AI-SDLC HDP implementation and assurance loop</title>
  <desc id="desc">Intent and operating context become a provider-neutral AI-SDLC Harness Definition Package. An implementation binding maps the HDP to a generated harness. The bound model, harness, runtime, environment, and task produce a sealed software change and trace. Outside that system, an independent evaluator compares sealed outputs with the public acceptance contract and produces provenance-linked evidence and a scoped decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#37474F"/>
    </marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:30px;font-weight:700;fill:#13343B}
      .subtitle{font-size:18px;fill:#546E7A}
      .phase{font-size:21px;font-weight:700;fill:#13343B}
      .label{font-size:18px;font-weight:700}
      .detail{font-size:15px;font-weight:500}
      .light{fill:#FFFFFF}.dark{fill:#13343B}.muted{fill:#546E7A}
      .line{fill:none;stroke:#37474F;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="880" fill="#FFFFFF"/>
  <text x="50" y="46" class="title">From AI-SDLC definition to independent evidence</text>
  <text x="50" y="76" class="subtitle">The HDP defines the contract; a binding implements it; an external evaluator tests the bound system</text>

  <text x="50" y="122" class="phase">1. Define the contract</text>
  <text x="650" y="122" class="phase">2. Bind and generate</text>

  <rect x="50" y="145" width="220" height="100" rx="14" fill="#ECEEF0" stroke="#607D8B" stroke-width="2"/>
  <text x="160" y="186" text-anchor="middle" class="label dark">Intent + context</text>
  <text x="160" y="215" text-anchor="middle" class="detail muted">Outcomes · tasks · authority</text>

  <rect x="330" y="135" width="250" height="120" rx="14" fill="#13343B" stroke="#13343B" stroke-width="2"/>
  <text x="455" y="182" text-anchor="middle" class="label light">Provider-neutral</text>
  <text x="455" y="211" text-anchor="middle" class="label light">AI-SDLC HDP</text>
  <text x="455" y="237" text-anchor="middle" class="detail light">Versioned contract</text>

  <rect x="650" y="145" width="210" height="100" rx="14" fill="#546E7A" stroke="#455A64" stroke-width="2"/>
  <text x="755" y="186" text-anchor="middle" class="label light">Implementation</text>
  <text x="755" y="215" text-anchor="middle" class="label light">binding</text>

  <rect x="920" y="135" width="230" height="120" rx="14" fill="#20808D" stroke="#187078" stroke-width="2"/>
  <text x="1035" y="177" text-anchor="middle" class="label light">Generated harness</text>
  <text x="1035" y="207" text-anchor="middle" class="detail light">Instructions · policy</text>
  <text x="1035" y="232" text-anchor="middle" class="detail light">verification · recorder</text>

  <path d="M270 195 H330" class="line"/>
  <path d="M580 195 H650" class="line"/>
  <text x="615" y="181" text-anchor="middle" class="detail muted">maps</text>
  <path d="M860 195 H920" class="line"/>
  <text x="890" y="181" text-anchor="middle" class="detail muted">creates</text>

  <rect x="50" y="315" width="1100" height="235" rx="18" fill="#E8F4F6" stroke="#187078" stroke-width="2"/>
  <text x="76" y="351" class="phase">3. Operate the outcome-bearing system</text>
  <text x="1124" y="351" text-anchor="end" class="detail muted">model + harness + runtime + environment + task</text>

  <rect x="90" y="390" width="230" height="105" rx="13" fill="#FFFFFF" stroke="#187078" stroke-width="2"/>
  <text x="205" y="431" text-anchor="middle" class="label dark">Environment + task</text>
  <text x="205" y="460" text-anchor="middle" class="detail muted">Disposable repository</text>
  <text x="205" y="483" text-anchor="middle" class="detail muted">Public task contract</text>

  <rect x="445" y="380" width="310" height="125" rx="13" fill="#20808D" stroke="#187078" stroke-width="2"/>
  <text x="600" y="424" text-anchor="middle" class="label light">Bound model + harness + runtime</text>
  <text x="600" y="455" text-anchor="middle" class="detail light">Implement · verify · record</text>
  <text x="600" y="480" text-anchor="middle" class="detail light">Stop or escalate when required</text>

  <rect x="875" y="390" width="235" height="105" rx="13" fill="#FFFFFF" stroke="#187078" stroke-width="2"/>
  <text x="992" y="431" text-anchor="middle" class="label dark">Sealed result</text>
  <text x="992" y="460" text-anchor="middle" class="detail muted">Software change</text>
  <text x="992" y="483" text-anchor="middle" class="detail muted">Trace + command ledger</text>

  <path d="M320 443 H445" class="line"/>
  <text x="382" y="428" text-anchor="middle" class="detail muted">public task</text>
  <path d="M755 443 H875" class="line"/>
  <text x="815" y="428" text-anchor="middle" class="detail muted">observable output</text>
  <path d="M1035 255 V285 H600 V380" class="line"/>
  <text x="820" y="276" text-anchor="middle" class="detail muted">configures</text>

  <rect x="50" y="610" width="1100" height="220" rx="18" fill="#FFF3E0" stroke="#C47530" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="76" y="646" class="phase">4. Evaluate independently</text>
  <text x="1124" y="646" text-anchor="end" class="detail muted">outside the model-harness system</text>

  <rect x="80" y="690" width="220" height="90" rx="13" fill="#FFFFFF" stroke="#C47530" stroke-width="2"/>
  <text x="190" y="727" text-anchor="middle" class="label dark">Public acceptance</text>
  <text x="190" y="755" text-anchor="middle" class="label dark">contract</text>

  <rect x="355" y="680" width="220" height="110" rx="13" fill="#E08A3C" stroke="#C47530" stroke-width="2"/>
  <text x="465" y="725" text-anchor="middle" class="label dark">External evaluator</text>
  <text x="465" y="755" text-anchor="middle" class="detail dark">Recomputes acceptance</text>

  <rect x="630" y="680" width="250" height="110" rx="13" fill="#FFFFFF" stroke="#C47530" stroke-width="2"/>
  <text x="755" y="720" text-anchor="middle" class="label dark">Provenance-linked</text>
  <text x="755" y="749" text-anchor="middle" class="label dark">evidence</text>
  <text x="755" y="774" text-anchor="middle" class="detail muted">Requirements · tests · results</text>

  <rect x="935" y="690" width="180" height="90" rx="45" fill="#2E7D32" stroke="#2E7D32" stroke-width="2"/>
  <text x="1025" y="727" text-anchor="middle" class="label light">Scoped</text>
  <text x="1025" y="755" text-anchor="middle" class="label light">decision</text>

  <path d="M455 255 V280 H24 V735 H80" class="line"/>
  <text x="105" y="591" class="detail muted">public criteria only</text>
  <path d="M300 735 H355" class="line"/>
  <path d="M992 495 V580 H465 V680" class="line"/>
  <text x="748" y="570" text-anchor="middle" class="detail muted">sealed outputs + trace</text>
  <path d="M575 735 H630" class="line"/>
  <path d="M880 735 H935" class="line"/>

</svg>
