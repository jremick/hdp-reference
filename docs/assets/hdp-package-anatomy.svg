<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Harness Definition Package information architecture</title>
  <desc id="desc">The 24 HDP information families are grouped into intent and scope, capabilities and contracts, execution design, governance and controls, evaluation and assurance, and evolution and risk.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#37474F"/></marker>
    <style>
      .title{font:700 29px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#13343B}.subtitle{font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#546E7A}.head{font:700 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#13343B}.body{font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#13343B}.light{fill:#FFFFFF}.line{fill:none;stroke:#37474F;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <text x="48" y="50" class="title">What an HDP contains</text>
  <text x="48" y="78" class="subtitle">Twenty-four linked families, grouped into six readable domains</text>
  <rect x="390" y="105" width="420" height="92" rx="16" fill="#13343B" stroke="#13343B" stroke-width="3"/>
  <text x="600" y="143" text-anchor="middle" class="head light">Harness Definition Package</text>
  <text x="600" y="171" text-anchor="middle" class="body light">one resolved, versioned contract</text>
  <path d="M600 197 V224" class="line"/>
  <path d="M200 224 H1000" fill="none" stroke="#37474F" stroke-width="2"/>
  <path d="M200 224 V250 M600 224 V250 M1000 224 V250" class="line"/>

  <rect x="40" y="250" width="320" height="160" rx="16" fill="#ECEEF0" stroke="#607D8B" stroke-width="2"/>
  <text x="200" y="287" text-anchor="middle" class="head">Intent and scope</text>
  <text x="200" y="322" text-anchor="middle" class="body"><tspan x="200">metadata • purpose</tspan><tspan x="200" dy="25">operationalContext • success</tspan><tspan x="200" dy="25">requirements</tspan></text>

  <rect x="440" y="250" width="320" height="160" rx="16" fill="#E8F4F6" stroke="#187078" stroke-width="2"/>
  <text x="600" y="287" text-anchor="middle" class="head">Capabilities and contracts</text>
  <text x="600" y="329" text-anchor="middle" class="body"><tspan x="600">models • contracts</tspan><tspan x="600" dy="25">context • tools</tspan></text>

  <rect x="840" y="250" width="320" height="160" rx="16" fill="#E8F4F6" stroke="#187078" stroke-width="2"/>
  <text x="1000" y="287" text-anchor="middle" class="head">Execution design</text>
  <text x="1000" y="322" text-anchor="middle" class="body"><tspan x="1000">orchestration • state • resources</tspan><tspan x="1000" dy="25">failures • runtime</tspan></text>

  <rect x="40" y="470" width="320" height="160" rx="16" fill="#FFF3E0" stroke="#C47530" stroke-width="2"/>
  <text x="200" y="507" text-anchor="middle" class="head">Governance and controls</text>
  <text x="200" y="549" text-anchor="middle" class="body"><tspan x="200">governance • safety</tspan><tspan x="200" dy="25">observability</tspan></text>

  <rect x="440" y="470" width="320" height="160" rx="16" fill="#FFF3E0" stroke="#C47530" stroke-width="2"/>
  <text x="600" y="507" text-anchor="middle" class="head">Evaluation and assurance</text>
  <text x="600" y="549" text-anchor="middle" class="body"><tspan x="600">evaluation • traceability</tspan><tspan x="600" dy="25">monitoring</tspan></text>

  <rect x="840" y="470" width="320" height="160" rx="16" fill="#ECEEF0" stroke="#607D8B" stroke-width="2"/>
  <text x="1000" y="507" text-anchor="middle" class="head">Evolution and risk</text>
  <text x="1000" y="549" text-anchor="middle" class="body"><tspan x="1000">evolution • limitations</tspan><tspan x="1000" dy="25">risks • extensions</tspan></text>

  <path d="M200 410 V460 M600 410 V460 M1000 410 V460" class="line"/>
  <text x="48" y="690" class="subtitle">The grouping is informative; exact names, types, and cardinalities are defined by the canonical schema.</text>
</svg>
