name: Validate HDP reference

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-validation.txt
      - name: Validate specification artifacts
        run: python scripts/validate_reference.py
      - name: Validate Agent Skills
        run: |
          python scripts/validate_skill.py skills/create-hdp
          python scripts/validate_skill.py skills/analyse-existing-harness
